# Baut die Android-App für den Play Store: signiertes App-Bundle (.aab) als Download unter „Artifacts“
# und lädt es automatisch in die Play Console hoch (Track wählbar; „keiner“ = nur bauen).
# Nur manuell über "Run workflow". versionCode = Laufnummer dieses Workflows (steigt bei jedem Lauf automatisch).
# Vor dem Bauen: typecheck und alle Tests (wie pages.yml).
#
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64      Upload-Schlüssel (.p12) als Base64
#   UPLOAD_KEYSTORE_PASSWORD    Passwort dazu
#   PLAY_SERVICE_ACCOUNT_JSON   JSON-Schlüssel des Google-Cloud-Service-Kontos für den Play-Upload.
#                               Einrichtung (einmalig): Google-Cloud-Projekt anlegen, „Google Play Android
#                               Developer API“ aktivieren, Service-Konto + JSON-Schlüssel erstellen, dann in der
#                               Play Console unter „Nutzer und Berechtigungen“ die Service-Konto-E-Mail einladen
#                               und ihr für die App Edi die Release-Berechtigungen geben.
#
# Wichtig: Die ALLERERSTE Version einer neuen App muss von Hand in der Play Console hochgeladen werden –
# erst danach funktioniert der automatische Upload. Solange die App noch nicht veröffentlicht ist,
# akzeptiert Google nur den Release-Status „draft“ (deshalb ist das die Voreinstellung); nach der
# Veröffentlichung beim Starten „completed“ wählen, damit der Rollout direkt losläuft.
name: Android-Release für den Play Store

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versionsname, den Nutzer sehen (z. B. 1.0)"
        required: true
        default: "1.0"
      play_track:
        description: "Play-Upload: Ziel-Track (keiner = nur bauen)"
        type: choice
        required: true
        default: "internal"
        options:
          - internal     # Interner Test
          - alpha        # Geschlossener Test
          - production   # Produktion
          - keiner       # kein Upload, nur .aab bauen
      play_status:
        description: "Release-Status (unveröffentlichte App: draft; später: completed)"
        type: choice
        required: true
        default: "draft"
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Secrets vorhanden?
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.play_track }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Secrets UPLOAD_KEYSTORE_BASE64 und UPLOAD_KEYSTORE_PASSWORD fehlen (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ "$TRACK" != "keiner" ] && [ -z "$PLAY" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON fehlt. Entweder anlegen (Einrichtung: siehe Kommentar oben in release.yml) oder den Workflow mit play_track = keiner starten, um nur zu bauen."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # nur Geprüftes geht in den Store: dieselben Prüfungen wie vor dem Veröffentlichen der Website
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/edi
      - run: npx cap sync android
        working-directory: apps/edi
      - name: Upload-Schlüssel bereitstellen
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.p12"
      - name: App-Bundle bauen und signieren
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.p12
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
        working-directory: apps/edi/android
      - name: Signatur prüfen
        run: |
          AAB=apps/edi/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          jarsigner -verify "$AAB" | grep -q "jar verified"
      - name: Schlüssel löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: edi-${{ inputs.version_name }}-${{ github.run_number }}
          path: apps/edi/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: In die Play Console hochladen (${{ inputs.play_track }})
        if: ${{ inputs.play_track != 'keiner' }}
        # fremde Action: auf den Commit von v1.1.5 festgelegt (ein verschobenes Tag kann so keinen anderen Code mit dem Service-Konto ausführen)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.edi.lernen
          releaseFiles: apps/edi/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
          releaseName: "${{ github.run_number }} (${{ inputs.version_name }})"
