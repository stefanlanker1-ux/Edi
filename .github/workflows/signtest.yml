# Baut die Android-App für den Play Store: signiertes App-Bundle (.aab) als Download unter „Artifacts“.
# Nur manuell über "Run workflow". Braucht die Secrets UPLOAD_KEYSTORE_BASE64 (Upload-Schlüssel .p12, Base64)
# und UPLOAD_KEYSTORE_PASSWORD. versionCode = Laufnummer dieses Workflows (steigt bei jedem Lauf automatisch).
name: Signiertest (temporär)

on:
  push:
    branches: [signtest-tmp]

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build -w apps/edi
      - run: npx cap sync android
        working-directory: apps/edi
      - name: Wegwerf-Schlüssel
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/upload.p12" -storetype pkcs12 -storepass testtest -alias upload -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Test"
      - name: App-Bundle bauen und signieren
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.p12
          UPLOAD_KEYSTORE_PASSWORD: testtest
        run: ./gradlew bundleRelease --no-daemon
        working-directory: apps/edi/android
      - name: Signatur prüfen
        run: |
          AAB=apps/edi/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          jarsigner -verify "$AAB" | grep -q "jar verified"
      - name: Schlüssel löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: edi-1.0-${{ github.run_number }}
          path: apps/edi/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
