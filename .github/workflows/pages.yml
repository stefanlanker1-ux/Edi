# Baut die App und veröffentlicht sie auf GitHub Pages:
#   …/Edi/  App (#/<modul>) · …/Edi/edi-offline.html  Einzeldatei · …/Edi/<modul>/  Weiterleitung früherer Adressen
# Läuft bei jedem Push auf main, der die App betrifft (Pfade unten, alles was Prüfung und Build lesen), oder manuell über "Run workflow".
name: App auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
    paths: ["apps/**", "modules/**", "packages/**", "scripts/**", "package.json", "package-lock.json", "tsconfig.base.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
